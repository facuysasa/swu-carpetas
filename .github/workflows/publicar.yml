name: Publicar la app

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'   # todos los lunes: catálogo y precios nuevos
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - id: pages
        uses: actions/configure-pages@v6

      - name: Armar el catálogo de cartas
        env:
          PREV_CATALOG_URL: ${{ steps.pages.outputs.base_url }}/data/catalog.json
          EVENT: ${{ github.event_name }}
        run: node scripts/build-catalog.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
